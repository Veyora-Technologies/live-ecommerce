name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: "file:./prisma/ci.db"
      LIVE_DATA_MODE: "demo"
      LIVE_ALLOW_DEMO_SEED: "1"
      NEXT_PUBLIC_APP_URL: "http://127.0.0.1:3000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Generate ephemeral CI-only secrets
        run: |
          printf 'JWT_SECRET=%s\n' "$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          printf 'LIVE_SECRET_ENCRYPTION_KEY=%s\n' "$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          printf 'CRON_SECRET=%s\n' "$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          printf 'LIVE_DEMO_USER_PASSWORD=%s\n' "$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          printf 'LIVE_DEMO_ADMIN_PASSWORD=%s\n' "$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps
      - name: Validate Prisma schema and client
        run: |
          ./node_modules/.bin/prisma validate
          ./node_modules/.bin/prisma generate
      - name: TypeScript
        run: ./node_modules/.bin/tsc --noEmit --incremental false --pretty false
      - name: ESLint debt budget
        run: npm run lint:ci
      - name: Unit tests
        run: npm test -- --reporter=dot
      - name: Production dependency audit (blocking)
        run: npm audit --omit=dev --audit-level=high
      - name: Push schema into isolated CI SQLite database
        run: ./node_modules/.bin/prisma db push --skip-generate
      - name: Seed isolated CI accounts and sample records
        run: npm run db:seed
      - name: Production build
        run: npm run build
      - name: HTTP integration suite against production build
        shell: bash
        run: |
          set -euo pipefail
          LIVE_TEST_RELAXED_RATE_LIMITS=1 npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/live-next-start.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT

          ready=0
          for attempt in $(seq 1 90); do
            if curl --silent --show-error --fail http://127.0.0.1:3000/api/v1/health >/tmp/live-health.json; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/live-next-start.log
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/live-next-start.log
            echo "Production server did not become ready within 90 seconds." >&2
            exit 1
          fi

          LIVE_INTEGRATION=1 LIVE_BASE_URL=http://127.0.0.1:3000 npm test -- --reporter=dot
      - name: Full dependency audit (blocking high threshold)
        run: npm audit --audit-level=high
